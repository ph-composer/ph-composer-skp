name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same pull request supersedes the run in progress; pushes to main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  offline:
    name: make ci (Ruby ${{ matrix.ruby-version }})
    # Pinned: ruby-builder publishes only the latest patch of each series for newer images, so
    # ubuntu-26.04 has no 2.7.2 or 3.2.2 and the exact SketchUp patches would 404.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 2.7.2 is what SketchUp 2023 embeds, the support floor; 3.2.2 is the current proving
        # host. Ruby 3 keyword separation is invisible to a loop that runs on only one of them.
        ruby-version: ["2.7.2", "3.2.2"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: ${{ matrix.ruby-version }}
          # Installs the `Gemfile.lock` so `make lint` runs rubocop rather than taking its skip
          # path. A skipped linter in CI is a rule that is not enforced.
          bundler-cache: true

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: "10.33.0"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"

      # Same reason as `bundler-cache`: without it `make lint` skips eslint.
      - run: pnpm install --frozen-lockfile

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: make ci
        run: make ci RUBY=$(which ruby)
