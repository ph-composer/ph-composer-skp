name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same pull request supersedes the run in progress; pushes to main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: Select CI checks
    runs-on: ubuntu-24.04
    outputs:
      route: ${{ steps.scope.outputs.route }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify the diff and check docs
        id: scope
        shell: bash
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="$PUSH_BEFORE"
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            base=HEAD^1
          fi
          route=$(python3 tools/ci_scope.py "$base")
          if [[ "$route" == docs ]]; then
            make lint-paths
          fi
          echo "Selected CI route: $route"
          echo "route=$route" >> "$GITHUB_OUTPUT"

  offline:
    name: make ci (Ruby ${{ matrix.ruby-version }})
    needs: scope
    if: needs.scope.outputs.route == 'full'
    # Pinned: ruby-builder publishes only the latest patch of each series for newer images, so
    # ubuntu-26.04 has no 2.7.2 or 3.2.2 and the exact SketchUp patches would 404.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 2.7.2 is what SketchUp 2023 embeds, the support floor; 3.2.2 is the current proving
        # host. Ruby 3 keyword separation is invisible to a loop that runs on only one of them.
        ruby-version: ["2.7.2", "3.2.2"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: ${{ matrix.ruby-version }}
          # Installs the `Gemfile.lock` so `make lint` runs rubocop rather than taking its skip
          # path. A skipped linter in CI is a rule that is not enforced.
          bundler-cache: true

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: "10.33.0"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"

      # Same reason as `bundler-cache`: without it `make lint` skips eslint.
      - run: pnpm install --frozen-lockfile

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: make ci
        run: make ci RUBY="$(command -v ruby)"

  gate:
    name: CI gate
    needs: [scope, offline]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Reject failed or cancelled dependencies
        if: ${{ failure() || cancelled() }}
        run: exit 1
      - name: Require the selected checks to pass
        if: ${{ !failure() && !cancelled() }}
        shell: bash
        env:
          ROUTE: ${{ needs.scope.outputs.route }}
          SCOPE_RESULT: ${{ needs.scope.result }}
          OFFLINE_RESULT: ${{ needs.offline.result }}
        run: |
          echo "route=$ROUTE scope=$SCOPE_RESULT offline=$OFFLINE_RESULT"
          if [[ "$SCOPE_RESULT" != success ]]; then
            exit 1
          fi
          case "$ROUTE:$OFFLINE_RESULT" in
            docs:skipped|full:success) exit 0 ;;
            *) exit 1 ;;
          esac
