    <meta charset="utf-8">
    <!-- No network, no inline script, nothing but the extension's own files. Styles alone allow inline: the
         blocked-run report shows in a srcdoc frame, which inherits this policy, and a standalone report must
         carry its stylesheet inline. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1">

  <body class="phc-workspace live-panel" data-phc-entry="panel">
    <div class="phc-app-header">
      <nav class="phc-tabs" aria-label="Sections">
        <button type="button" data-tab="overview">Zones</button>
        <button type="button" data-tab="assemblies">Assemblies</button>
        <button type="button" data-tab="windows">Window Types</button>
        <button type="button" data-tab="thermal_bridges">Thermal Bridges</button>
        <button type="button" data-tab="library">Library</button>
        <button type="button" data-tab="export">Export</button>
        <button type="button" disabled data-tooltip="Planned" aria-label="Systems, planned">Systems</button>
      </nav>
      <div class="phc-unit-toggle" role="group" aria-label="Display units">
        <button type="button" data-unit-system="IP" aria-pressed="false" aria-label="Set display units to IP">IP</button>
        <button type="button" data-unit-system="SI" aria-pressed="true" aria-label="Set display units to SI">SI</button>
      </div>
    </div>
    <div class="phc-notice-layer" data-notice-layer></div>
    <main class="panel-panes">
      <div data-pane="overview"></div>
      <div data-pane="windows" hidden></div>
      <div data-pane="assemblies" hidden></div>
      <div data-pane="thermal_bridges" hidden></div>
      <div data-pane="library" hidden></div>
      <div data-pane="export" hidden></div>
    </main>
    <footer class="phc-footer" data-section="footer"></footer>
