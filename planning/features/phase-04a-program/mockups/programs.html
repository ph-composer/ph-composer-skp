<title>Programs prototype</title>
<!-- Clickable prototype for the Phase 4a GUI discussion. Links the panel's real stylesheets and reuses
     its class names; the script below is a throwaway state machine, not panel code. All model data is
     synthetic; Phius program values are read from honeybee-ph's PHIUS_programs.py. -->
<link rel="stylesheet" href="../../../../src/ph_composer/html/base.css">
<link rel="stylesheet" href="../../../../src/ph_composer/html/overlay.css">
<link rel="stylesheet" href="../../../../src/ph_composer/html/shell.css">
<link rel="stylesheet" href="../../../../src/ph_composer/html/table.css">
<link rel="stylesheet" href="../../../../src/ph_composer/html/features/zones/zones.css">
<link rel="stylesheet" href="../../../../src/ph_composer/html/library/library.css">
<link rel="stylesheet" href="../../../../src/ph_composer/html/features/assemblies/assembly.css">
<link rel="stylesheet" href="../../../../src/ph_composer/html/features/windows/windows.css">
<style>
  /* ---- Mockup chrome: the journey strip is not part of the panel. ---- */
  .mk-strip { display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px; padding:6px 12px; background:#1d2b30; color:#e8eef0; font:12px/1.3 system-ui, sans-serif; }
  .mk-strip b { color:#fff; }
  .mk-strip button { min-height:24px; padding:2px 9px; border:1px solid #4b5f66; border-radius:12px; background:transparent; color:#e8eef0; font-size:12px; cursor:pointer; }
  .mk-strip button[aria-pressed="true"] { background:#c8930a; border-color:#c8930a; color:#fff; }
  .mk-hint { flex:1 1 100%; color:#c9d6da; }
  .mk-hint em { color:#ffd66b; font-style:normal; }
  /* ---- Programs tab layout: rail, editor, library sidebar (the Window Types arrangement). ---- */
  .pgm-layout { display:grid; grid-template-columns:210px minmax(0,1fr) 260px; min-height:calc(100vh - 190px); }
  .pgm-layout.no-library { grid-template-columns:210px minmax(0,1fr); }
  .pgm-main { min-width:0; overflow:auto; padding:0 18px 24px; }
  .pgm-library { border-left:1px solid var(--line); min-width:0; overflow:auto; }
  .pgm-head { display:flex; align-items:flex-start; gap:16px; padding:16px 0 12px; border-bottom:1px solid var(--line); }
  .pgm-head h2 { margin:0; font-size:var(--text-xl); font-weight:600; }
  .pgm-head .pgm-sub { color:var(--muted); font-size:12px; margin-top:4px; }
  .pgm-head .pgm-tools { margin-left:auto; display:flex; gap:4px; align-items:center; }
  .pgm-badge { display:inline-flex; align-items:center; gap:4px; margin-left:8px; padding:1px 7px; border-radius:10px; background:var(--surface-alt); color:var(--muted-strong); font-size:11px; font-weight:600; vertical-align:middle; }
  .pgm-badge.is-lib { background:#e6f0f3; color:#0b5360; }
  .pgm-loads { display:grid; grid-template-columns:repeat(auto-fill, minmax(330px, 1fr)); gap:12px; padding-top:14px; }
  .pgm-card { border:1px solid var(--line); border-radius:var(--radius-sm); background:#fff; }
  .pgm-card-head { display:flex; align-items:center; gap:8px; min-height:34px; padding:4px 10px; border-bottom:1px solid var(--line); background:var(--surface-alt); border-radius:var(--radius-sm) var(--radius-sm) 0 0; }
  .pgm-card-head svg { color:var(--muted-strong); flex:none; }
  .pgm-card-head strong { font-size:13px; }
  .pgm-tag { margin-left:auto; padding:1px 6px; border-radius:9px; background:#eef1f3; color:var(--muted); font-size:11px; white-space:nowrap; }
  .pgm-tag.is-note { background:#e6f0f3; color:#0b5360; }
  .pgm-rows { display:grid; grid-template-columns:minmax(0,1fr) 118px; }
  .pgm-row { display:contents; }
  .pgm-row > span, .pgm-row > div { display:flex; align-items:center; min-height:30px; padding:2px 10px; border-bottom:1px solid #eef1f3; font-size:12px; }
  .pgm-row > span:first-child { color:var(--muted-strong); }
  .pgm-row .unit { color:var(--muted); margin-left:4px; }
  .pgm-row input { width:100%; min-height:24px; padding:2px 6px; text-align:right; font-variant-numeric:tabular-nums; border-color:transparent; background:transparent; }
  .pgm-row input:hover, .pgm-row input:focus { border-color:var(--line-strong); background:#fff; }
  .pgm-row select { width:100%; min-height:24px; font-size:12px; }
  .pgm-row.is-missing > span, .pgm-row.is-missing > div { background:var(--warning-surface); }
  .pgm-row.is-missing input { color:var(--warning-ink); font-weight:600; }
  .pgm-rule { grid-column:1 / -1; display:flex; gap:8px; align-items:flex-start; padding:8px 10px; border-bottom:1px solid #eef1f3; font-size:12px; color:var(--muted-strong); background:#f3f8f9; }
  .pgm-rule svg { flex:none; color:#0b5360; margin-top:1px; }
  .pgm-rule b { color:var(--ink); font-weight:600; }
  .pgm-replaced { grid-column:1 / -1; padding:6px 10px; font-size:12px; color:#0b5360; background:#e6f0f3; border-bottom:1px solid #d5e5ea; }
  .pgm-sched { display:flex; gap:6px; align-items:center; grid-column:1 / -1; padding:6px 10px; font-size:12px; color:var(--muted-strong); }
  .pgm-sched button { min-height:24px; padding:1px 8px; font-size:12px; border-radius:12px; display:inline-flex; gap:5px; align-items:center; }
  .pgm-more { grid-column:1 / -1; padding:4px 10px 6px; font-size:11px; color:var(--muted); }
  .pgm-metrics { display:flex; gap:22px; margin-top:8px; }
  .pgm-metric small { display:block; color:var(--muted); font-size:11px; }
  .pgm-metric strong { font-size:15px; font-variant-numeric:tabular-nums; }
  .phc-workspace .window-type-row.selected > button:first-child { background:var(--interaction-highlight-tint); color:var(--interaction-highlight); font-weight:600; }
  .window-type-row .pgm-row-note { padding-right:8px; color:var(--muted); font-size:11px; }
  .lib-row-add { margin-left:auto; }
  .library-sidebar-row { display:flex; align-items:center; }
  .library-sidebar-row .library-sidebar-row-button { flex:1; min-width:0; }
  .lib-unavailable { margin:8px 10px; padding:8px; border:1px dashed var(--line-strong); border-radius:var(--radius-sm); color:var(--muted); font-size:12px; }
  .lib-meta { color:var(--muted); font-size:11px; margin-left:6px; white-space:nowrap; }
  /* ---- Schedules ---- */
  .sch-form { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:10px 14px; padding:14px 0; max-width:760px; }
  .sch-form label input, .sch-form label select { min-height:28px; }
  .sch-strip { margin:6px 0 14px; }
  .sch-strip svg { display:block; }
  .sch-caption { color:var(--muted); font-size:11px; margin:12px 0 4px; }
  .sch-advanced { display:flex; gap:8px; align-items:center; margin-top:14px; padding-top:12px; border-top:1px solid var(--line); color:var(--muted); font-size:12px; }
  /* ---- Zones / Programs table ---- */
  .zp-table td, .zp-table th { text-align:left; }
  .zp-table td.num, .zp-table th.num { text-align:right; font-variant-numeric:tabular-nums; }
  .zp-table th.num .phc-header-label-row { justify-content:flex-end; }
  .zp-table td { font-size:12px; }
  .zp-table select.phc-enum-cell { max-width:100%; }
  .zp-table .is-default { color:var(--muted); font-style:italic; }
  .zp-table td input.phc-cell-input { text-align:right; }
  .zp-muted { color:var(--muted); }
  .zp-amber { color:var(--warning-ink); font-weight:600; }
  .zp-cell-flag { display:inline-flex; vertical-align:middle; margin-left:4px; color:#9a6b00; cursor:help; }
  .zp-dwelling { display:inline-flex; align-items:center; gap:4px; min-height:22px; padding:0 8px; border:1px solid var(--line); border-radius:11px; background:#f4f1fa; font-size:12px; cursor:pointer; white-space:nowrap; }
  .zp-dwelling.is-none { background:transparent; color:var(--muted); border-style:dashed; }
  .zp-seg td { background:var(--surface-alt); font-weight:600; }
  .zp-seg td .zp-muted { font-weight:400; }
  .zp-seg select { font-weight:400; }
  .zp-bubble { position:absolute; z-index:40; width:260px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:#fff; box-shadow:0 6px 24px #0b1f2626; font-size:12px; }
  .zp-bubble h3 { margin:0 0 8px; font-size:13px; }
  .zp-bubble dl { display:grid; grid-template-columns:auto 1fr; gap:4px 10px; margin:0; }
  .zp-bubble dt { color:var(--muted); }
  .zp-bubble dd { margin:0; text-align:right; font-variant-numeric:tabular-nums; }
  .zp-tip { position:fixed; z-index:60; max-width:300px; padding:6px 8px; border-radius:6px; background:#1d2b30; color:#fff; font-size:12px; line-height:1.35; pointer-events:none; }
  .zp-notice { position:fixed; left:50%; bottom:56px; transform:translateX(-50%); z-index:70; display:flex; gap:10px; align-items:center; padding:9px 14px; border:1px solid var(--line); border-radius:8px; background:#fff; box-shadow:0 6px 24px #0b1f2626; font-size:13px; }
  .zp-notice svg { color:#1f7a4d; }
  .phc-selection-bar select { min-height:28px; max-width:220px; }
  .panel-panes { position:relative; }
  #pane { padding:0 var(--page-gutter); }
  @media (max-width: 900px) {
    .pgm-layout, .pgm-layout.no-library { grid-template-columns:minmax(0,1fr); }
    .pgm-layout .window-rail { border-right:0; border-bottom:1px solid var(--line); max-height:170px; }
    .pgm-library { border-left:0; border-top:1px solid var(--line); }
    .pgm-main { padding:0 0 18px; }
    .pgm-loads { grid-template-columns:minmax(0,1fr); }
  }
  .zp-cellflex { display:flex; align-items:center; gap:4px; }
  .zp-cellflex select { flex:1; min-width:0; }
  .pgm-library .library-sidebar-heading { display:flex; align-items:center; gap:4px; padding:12px 10px 6px; }
  .pgm-library .library-sidebar-toggle { flex:1; text-align:left; }
  .pgm-library .library-sidebar-content { padding:0 10px 12px; display:flex; flex-direction:column; gap:6px; }
  /* ---- Single dwelling switch ---- */
  .zp-single { color:var(--ink); font-weight:600; }
  .zp-single input { width:auto; margin:0; }
  .zp-frozen { color:var(--muted); }
  .zp-table td input.phc-cell-input.zp-need { background:var(--warning-surface); color:var(--warning-ink); font-weight:600; }
  .zp-table td input.phc-cell-input.zp-need::placeholder { color:var(--warning-ink); }
  .zp-seg td input.phc-cell-input { font-weight:600; background:#fff; border:1px solid var(--line); }
  .zp-confirm ul { margin:0; padding-left:18px; }
  .zp-confirm li { margin-bottom:6px; }
  .zp-seg-name { display:flex; align-items:center; gap:8px; min-height:24px; }
  .zp-seg-tag { font-weight:400; font-size:11px; color:var(--muted); border:1px solid var(--line); border-radius:9px; padding:0 6px; }
  .zp-seg-count { font-weight:400; color:var(--muted); }
  .zp-seg-single { display:inline-flex; align-items:center; gap:4px; font-weight:400; font-size:12px; white-space:nowrap; }
  .zp-seg-single input { margin:0; }
  .zp-seg-head { max-width:430px; }
  .zp-seg-line1 { display:flex; align-items:center; gap:6px; min-height:24px; }
  .zp-seg-title { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .zp-seg-line2 { display:flex; align-items:center; gap:10px; min-height:22px; font-weight:400; font-size:12px; color:var(--muted); }
  .zp-seg-line2 .zp-seg-count { font-size:12px; }
  .zp-seg-gear { width:22px; height:22px; margin-left:-4px; }
  .zp-seg-tools { display:inline-flex; gap:2px; margin-left:auto; flex:none; }
  .zp-seg-tools .phc-icon-button { width:24px; height:24px; }
  .zp-seg-tools .zp-hover { visibility:hidden; }
  .zp-seg:hover .zp-seg-tools .zp-hover, .zp-seg:focus-within .zp-seg-tools .zp-hover { visibility:visible; }
  .zp-seg.is-none td { color:var(--muted); }
  .zp-out td { color:var(--muted); }
  .zp-seg-rename { font:inherit; font-weight:600; width:180px; padding:1px 6px; }
  .zp-segdlg { width:600px; max-width:calc(100vw - 32px); }
  .zp-segdlg-body { max-height:62vh; overflow:auto; margin:0 -4px; padding:0 4px; }
  .zp-segdlg section { padding:10px 0 12px; border-top:1px solid var(--line); }
  .zp-segdlg h3 { margin:0 0 8px; font-size:13px; }
  .zp-grid { display:grid; grid-template-columns:210px 1fr; gap:6px 12px; align-items:center; font-size:12px; }
  .zp-grid > span:nth-child(odd) { color:var(--muted); }
  .zp-grid input:not([type=checkbox]), .zp-grid select { font:inherit; font-size:12px; height:26px; }
  .zp-grid input.zp-num { width:90px; text-align:right; }
  .zp-later { color:var(--muted); font-size:12px; }
</style>
</head>

    var html = '<div class="zp-bubble" style="left:' + (r.left - pr.left) + 'px; top:' + (r.bottom - pr.top + 4) + 'px" role="dialog" aria-label="' + esc(d.name) + '"><h3>' + svg("home", 13) + ' ' + esc(d.name) + '</h3><dl>' +
      '<dt>Units</dt><dd><input data-act="units" data-v="' + d.id + '" value="' + d.units + '" style="width:60px;text-align:right"></dd><dt>Zones</dt><dd>' + t.zones + '</dd><dt>Bedrooms</dt><dd>' + (d.beds !== null && d.beds !== undefined ? '<input data-act="dw-beds" data-v="' + d.id + '" value="' + d.beds + '" style="width:60px;text-align:right">' : t.beds) + '</dd>' +
      '<dt>Occupants</dt><dd>' + fmt(t.occ, 1) + (t.occRule ? ' <span class="zp-muted">(Phius: bedrooms + units)</span>' : "") + '</dd><dt>iCFA</dt><dd>' + fmt(t.icfa, 1) + ' m²</dd></dl>' +
      '<p class="zp-muted" style="margin:8px 0 0">' + (d.beds !== null && d.beds !== undefined ? 'Bedrooms were entered once for the whole dwelling under Single dwelling, and stay here.' : 'One unit count for several Zones, or several units in one Zone. Bedrooms and occupants are entered per Zone and summed here.') + '</p></div>';
    S.bubble = { html: html };
  }

  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-act]"); if (!el) { if (S.bubble && !e.target.closest(".zp-bubble")) { S.bubble = null; render(); } return; }
    var a = el.getAttribute("data-act"), v = el.getAttribute("data-v");
    if (el.tagName === "SELECT" || el.tagName === "INPUT" && el.type !== "checkbox") return;
    if (a === "journey") { S = baseState(+v); }
    else if (a === "reset") { S = baseState(S.journey); }
    else if (a === "tab") { S.tab = v; S.bubble = null; }
    else if (a === "ptab") { S.ptab = v; }
    else if (a === "check") { if (el.checked) S.checked[v] = 1; else delete S.checked[v]; }
    else if (a === "check-all") { S.checked = {}; if (el.checked) checkable().forEach(function (z) { S.checked[z.id] = 1; }); }
    else if (a === "clear-checked") { S.checked = {}; }
    else if (a === "sel-program") { S.selProgram = v; }
    else if (a === "sel-schedule") { S.selSchedule = v; }
    else if (a === "sel-set") { S.selSet = v; }
    else if (a === "lib-add") { var p = addFromLibrary(S.lib, v); S.selProgram = p.id; notify("Added " + p.name + " to this file."); }
    else if (a === "new-program") {
      var always = S.schedules.filter(function (x) { return x.name === "Always On"; })[0];
      var np = { id: id("pgm"), name: "Program " + (S.programs.length), source: "custom", people: { ppa: null, sched: null }, lighting: { wpa: null, sched: null }, equip: { wpa: null, sched: null }, gas: { wpa: 0, sched: always.id },
        shw: { lph: 0, temp: 60, sched: always.id }, infil: { flow: 0.0003, sched: always.id }, vent: { pp: null, pa: null, pz: 0, ach: 0, sched: always.id }, setpoint: { heat: 20, cool: 25, hs: null, cs: null, dehum: 60 } };
      S.programs.push(np); S.selProgram = np.id; notify(np.name + " created. Rename it from its title.");
    }
    else if (a === "dup-program") { var src = prog(S.selProgram), cp = JSON.parse(JSON.stringify(src)); cp.id = id("pgm"); cp.name = src.name + " (copy)"; cp.source = "custom"; S.programs.push(cp); S.selProgram = cp.id; notify("Duplicated as " + cp.name + "."); }
    else if (a === "new-schedule") { var ns = sched("Schedule " + S.schedules.length, "Fractional", { start: 8, end: 18, frac: 1, base: 0, days: 5, weeks: 52 }, null, "file"); S.schedules.push(ns); S.selSchedule = ns.id; }
    else if (a === "open-schedule") {
      if (!v) { var s2 = sched("Schedule " + S.schedules.length, "Fractional", { start: 8, end: 18, frac: 1, base: 0, days: 5, weeks: 52 }, null, "file"); S.schedules.push(s2); v = s2.id;
        var cur = prog(S.selProgram); var lbl = el.closest(".pgm-sched").textContent; var map = { Occupancy: "people", Lighting: "lighting", Equipment: "equip" }; Object.keys(map).forEach(function (k) { if (lbl.indexOf(k) === 0) cur[map[k]].sched = v; }); }
      S.ptab = "schedules"; S.selSchedule = v;
    }
    else if (a === "new-set") { var ns2 = { id: id("set"), name: "Equipment Set " + (S.sets.length + 1), devices: [] }; S.sets.push(ns2); S.selSet = ns2.id; }
    else if (a === "dwelling") { dwellingBubble(v, el); }
    else if (a === "single") {
      var sg = seg(v);
      if (!el.checked) { sg.single = false; notify("Single dwelling is off for " + sg.name + ". Its dwelling and the residential default stay; assign per Zone now."); }
      else { var ch = singleChanges(sg); if (ch.length) { render(); confirmSingle(sg, ch); return; } applySingle(sg); }
    }
    else if (a === "new-seg") { var ng = newSegment(); notify(ng.name + " created. Move Zones into it from the selection bar."); }
    else if (a === "seg-settings") { openSegSettings(v); return; }
    else if (a === "seg-rename-start") { S.renaming = v; }
    else if (a === "seg-delete") { confirmDeleteSeg(v); return; }
    else return;
    render();
  });
  document.addEventListener("change", function (e) {
    var el = e.target, a = el.getAttribute("data-act"), v = el.getAttribute("data-v"); if (!a) return;
    if (a === "zone-program") assignProgram(S.zones.filter(function (z) { return z.id === v; }), el.value);
    else if (a === "bulk-program") assignProgram(S.zones.filter(function (z) { return S.checked[z.id]; }), el.value);
    else if (a === "bulk-dwelling") assignDwelling(S.zones.filter(function (z) { return S.checked[z.id]; }), el.value);
    else if (a === "bulk-set") { var zs = S.zones.filter(function (z) { return S.checked[z.id]; }); zs.forEach(function (z) { z.set = el.value === "none" ? null : el.value; if (z.dwelling) dw(z.dwelling).set = z.set; }); notify("Equipment Set changed on " + zs.length + " Zones."); }
    else if (a === "zone-set") { var z = S.zones.filter(function (x) { return x.id === v; })[0]; z.set = el.value || null; if (z.dwelling) { dw(z.dwelling).set = z.set; zonesOfDwelling(z.dwelling).forEach(function (o) { o.set = z.set; }); } }
    else if (a === "beds" || a === "occ") { var zz = S.zones.filter(function (x) { return x.id === v; })[0]; zz[a] = el.value === "" ? null : parseFloat(el.value); }
    else if (a === "bulk-seg") { moveZones(S.zones.filter(function (z) { return S.checked[z.id]; }), el.value); }
    else if (a === "seg-rename") { if (S.renaming !== v) return; var nm = el.value.trim(); if (nm) seg(v).name = nm; S.renaming = null; }
    else if (a === "house-beds") { house(seg(v)).beds = el.value === "" ? null : parseFloat(el.value); }
    else if (a === "house-occ") { house(seg(v)).occ = el.value === "" ? null : parseFloat(el.value); }
    else if (a === "house-set") { house(seg(v)).set = el.value || null; }
    else if (a === "dw-beds") { dw(v).beds = el.value === "" ? null : parseFloat(el.value); S.bubble = null; }
    else if (a === "units") { dw(v).units = Math.max(1, parseInt(el.value, 10) || 1); S.bubble = null; }
    else if (a === "lib-source") { S.lib = el.value; }
    else if (a === "load-value") { var p = prog(S.selProgram); p[el.getAttribute("data-load")][el.getAttribute("data-key")] = el.value === "" || el.value === "?" ? null : parseFloat(el.value); }
    else if (a === "sched-value") { var sc = schedById(S.selSchedule); sc.ph[el.getAttribute("data-key")] = parseFloat(el.value); if (el.getAttribute("data-key") === "days") sc.ph.daysYear = null; }
    else return;
    render();
  });
  document.addEventListener("input", function (e) {
    if (e.target.getAttribute("data-act") === "lib-search") { S.libQuery = e.target.value; var pos = e.target.selectionStart; render(); var i = document.querySelector('[data-act="lib-search"]'); i.focus(); i.setSelectionRange(pos, pos); }
  });
  var tip = document.getElementById("tip");
  document.addEventListener("mouseover", function (e) {
    var el = e.target.closest("[data-tip]"); if (!el) { tip.hidden = true; return; }
    tip.textContent = el.getAttribute("data-tip"); tip.hidden = false; var r = el.getBoundingClientRect();
    tip.style.left = Math.min(window.innerWidth - 310, Math.max(4, r.left)) + "px"; tip.style.top = (r.bottom + 6 + 60 > window.innerHeight ? r.top - tip.offsetHeight - 6 : r.bottom + 6) + "px";
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target.getAttribute("data-act") === "seg-rename") { e.target.blur(); return; }
    if (e.key === "Escape") { if (S.renaming) S.renaming = null; else if (S.bubble) S.bubble = null; else S.checked = {}; render(); }
  });

  // ---------------------------------------------------------------- boot from the query string
  var q = location.search;
  S = baseState(+((q.match(/journey=(\d)/) || [])[1] || 1));
  var view = (q.match(/view=(\w+)/) || [])[1];
  if (view && view !== "zones") { S.tab = "programs"; S.ptab = view; }
  // Scripted states for the README screenshots: &do=<step>
  var steps = (q.match(/do=([\w,-]+)/) || [])[1];
  if (steps) steps.split(",").forEach(function (st) {
    var all = S.zones;
    if (st === "checkall") all.forEach(function (z) { S.checked[z.id] = 1; });
    if (st === "house3") house(S.segments[0]).beds = 3;
    if (st === "unsingle") S.segments[0].single = false;
    if (st === "trysingle") setTimeout(function () { confirmSingle(S.segments[0], singleChanges(S.segments[0])); }, 50);
    if (st === "adu") { var ag = newSegment(); ag.name = "ADU"; S.renaming = null; S.zones.push({ id: id("zn"), name: "ADU studio", seg: ag.id, area: 38, icfa: 35.2, program: null, dwelling: null, beds: null, occ: null, set: null }, { id: id("zn"), name: "ADU bath", seg: ag.id, area: 6, icfa: 5.6, program: null, dwelling: null, beds: null, occ: null, set: null }); applySingle(ag); house(ag).beds = 1; }
    if (st === "shared") { assignDwelling(all, "shared"); S.checked = {}; }
    if (st === "each") { assignDwelling(all.filter(function (z) { return /^Apt/.test(z.name); }), "each"); }
    if (st === "beds") all.forEach(function (z, i) { if (/^Bedroom/.test(z.name)) z.beds = 1; if (/^Apt/.test(z.name)) z.beds = [1, 2, 1, 2][i % 4]; });
    if (st === "common") {
      assignProgram(all.filter(function (z) { return /Corridor/.test(z.name); }), "lib:mf:Indoor Corridor");
      assignProgram(all.filter(function (z) { return /Stair/.test(z.name); }), "lib:mf:Indoor Stair");
      assignProgram(all.filter(function (z) { return /Lobby/.test(z.name); }), "lib:mf:Common Mail");
      assignProgram(all.filter(function (z) { return /office/.test(z.name); }), "lib:mf:Common Office");
      assignProgram(all.filter(function (z) { return /Fitness/.test(z.name); }), "lib:mf:Workout Room");
    }
    if (st === "checkcorr") all.forEach(function (z) { if (/Corridor/.test(z.name)) S.checked[z.id] = 1; });
    if (st === "school") {
      assignProgram(all.filter(function (z) { return /Classroom/.test(z.name); }), "lib:nr:Classroom");
      assignProgram(all.filter(function (z) { return /Hallway/.test(z.name); }), "lib:nr:Hallway");
      assignProgram(all.filter(function (z) { return /Restroom/.test(z.name); }), "lib:nr:Restroom Public");
      assignProgram(all.filter(function (z) { return /office/.test(z.name); }), "lib:nr:Office Workspace Closed");
      assignProgram(all.filter(function (z) { return /Gym/.test(z.name); }), "lib:nr:Gym");
    }
    if (st === "libnr") { S.tab = "programs"; S.ptab = "programs"; S.lib = "nr"; var cl = programByName("Classroom"); if (cl) S.selProgram = cl.id; }
    if (st === "custom") { S.tab = "programs"; S.ptab = "programs"; var cp = phiusProgram("custom", ["Wet lab", 0.05, 7, 19, 250, 0.8, 9, 12, 25]); cp.name = "Wet lab"; cp.vent = { pp: 30, pa: 3.6, pz: 0, ach: 0, sched: cp.people.sched }; S.programs.push(cp); S.selProgram = cp.id; }
    if (st === "customsched") { S.ptab = "schedules"; S.selSchedule = prog(S.selProgram).people.sched; }
    if (st === "pdefault") { S.tab = "programs"; S.ptab = "programs"; S.selProgram = "pgm_default"; }
    if (st === "sets") { S.tab = "programs"; S.ptab = "sets"; }
    if (st === "longname") { S.segments[0].name = "Elementary School, Building A (classrooms, gym and canteen)"; }
    if (st === "moveshed") { S.zones.forEach(function (z) { if (z.name === "Bike shed") z.seg = null; }); }
    if (st === "checkshed") { S.zones.forEach(function (z) { if (z.name === "Bike shed") S.checked[z.id] = 1; }); }
    if (st === "newseg") { newSegment(); }
    if (st === "segsettings") { setTimeout(function () { openSegSettings(S.segments[0].id); }, 50); }
    if (st === "trydelete") { S.renaming = null; setTimeout(function () { confirmDeleteSeg(S.segments[0].id); }, 50); }
    if (st === "bubble") { setTimeout(function () { var b = document.querySelector('[data-act="dwelling"]'); if (b) { dwellingBubble(b.getAttribute("data-v"), b); render(); } }, 50); }
  });
  S.notice = null;
  render();
})();
</script>
</body>
